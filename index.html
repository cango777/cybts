<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:'Inter',system-ui,sans-serif; color:#EFE7D8;
    background: radial-gradient(115% 70% at 50% -5%, rgba(224,164,88,0.16) 0%, rgba(224,164,88,0) 55%),
      linear-gradient(180deg,#14271F 0%,#0C1A18 55%,#0A1413 100%); background-attachment:fixed; min-height:100vh; }
  #app { max-width:460px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)); }
  .eyebrow { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:rgba(239,231,216,0.55); text-align:center; }
  .hero { text-align:center; position:relative; padding:14px 0 4px; }
  .buyuk { font-family:'Fraunces',serif; font-weight:600; font-size:60px; line-height:1; color:#F6EEDF; text-shadow:0 0 50px rgba(224,164,88,0.35); margin-top:8px; }
  .buyuk small { font-size:21px; color:rgba(239,231,216,0.55); font-weight:500; }
  .hedefTarih { font-size:13px; color:rgba(239,231,216,0.6); margin-top:10px; }
  .canli { font-variant-numeric:tabular-nums; font-size:13px; color:#E0A458; margin-top:4px; letter-spacing:0.5px; }
  .toplam { margin-top:14px; font-family:'Fraunces',serif; font-size:26px; color:#F6EEDF; }
  .toplam span { font-size:12px; font-family:'Inter'; color:rgba(239,231,216,0.5); display:block; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:3px; }
  .stat { display:flex; gap:12px; margin-top:18px; }
  .stat .kutu { flex:1; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:13px 14px; }
  .stat .s { font-family:'Fraunces',serif; font-size:19px; color:#F6EEDF; }
  .stat .e { font-size:11px; color:rgba(239,231,216,0.5); margin-top:3px; letter-spacing:0.5px; }
  .ozetBar { margin-top:14px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:14px; }
  .ozetBar .u { display:flex; justify-content:space-between; font-size:12.5px; color:rgba(239,231,216,0.6); margin-bottom:9px; }
  .ozetBar .u b { color:#F6EEDF; font-weight:600; }
  .bar { height:7px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .bar > div { height:100%; border-radius:6px; background:linear-gradient(90deg,#5B9A78,#E0A458); }

  .odeme { margin-top:22px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:16px; }
  .odeme-ust { display:flex; align-items:center; justify-content:space-between; }
  .odeme-ust .ay { font-family:'Fraunces',serif; font-size:18px; color:#F6EEDF; }
  .oOk { width:34px; height:34px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:transparent; color:#EFE7D8; font-size:16px; cursor:pointer; }
  .odeme-durum { font-size:12px; color:rgba(239,231,216,0.55); margin:10px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .tumu { background:transparent; border:1px solid rgba(255,255,255,0.14); color:rgba(239,231,216,0.7); font-size:11px; padding:5px 10px; border-radius:20px; cursor:pointer; }
  .orow { display:flex; align-items:center; gap:11px; padding:9px 0; border-top:1px solid rgba(255,255,255,0.06); }
  .ocheck { width:26px; height:26px; min-width:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); background:transparent; color:#0C1A18; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .orow.odendi .ocheck { background:#5B9A78; border-color:#5B9A78; }
  .orow .ob { flex:1; font-size:13.5px; color:#EFE7D8; }
  .orow.odendi .ob { color:rgba(239,231,216,0.5); }
  .orow .ot { font-size:12.5px; color:rgba(239,231,216,0.6); }
  .oyok { font-size:12.5px; color:rgba(239,231,216,0.45); text-align:center; padding:10px 0; }

  .yolBaslik { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:rgba(239,231,216,0.5); margin:26px 0 14px; text-align:center; }
  .yol { position:relative; padding-left:30px; }
  .yol::before { content:''; position:absolute; left:9px; top:8px; bottom:26px; width:2px; background:rgba(255,255,255,0.10); }
  .durak { position:relative; margin-bottom:12px; }
  .nokta { position:absolute; left:-27px; top:20px; width:14px; height:14px; border-radius:50%; background:#0C1A18; border:2px solid rgba(255,255,255,0.18); }
  .durak.kapandi .nokta { background:#5B9A78; border-color:#5B9A78; box-shadow:0 0 12px rgba(91,154,120,0.6); }
  .durak.next .nokta { border-color:#E0A458; box-shadow:0 0 12px rgba(224,164,88,0.55); }
  .kart { background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px 15px; }
  .durak.next .kart { border-color:rgba(224,164,88,0.4); background:rgba(224,164,88,0.07); }
  .kart-ust { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .banka { font-size:15px; font-weight:600; color:#F6EEDF; }
  .turfaiz { font-size:11px; color:rgba(239,231,216,0.5); letter-spacing:0.5px; margin-top:1px; }
  .kalan { font-family:'Fraunces',serif; font-size:20px; color:#F6EEDF; white-space:nowrap; }
  .durak.kapandi .banka, .durak.kapandi .kalan { color:rgba(239,231,216,0.45); }
  .kart-orta { margin-top:10px; }
  .miniBar { height:5px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .miniBar > div { height:100%; border-radius:6px; background:linear-gradient(90deg,#5B9A78,#E0A458); }
  .kart-alt { display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:12px; color:rgba(239,231,216,0.55); }
  .kart-alt .taksit { color:rgba(239,231,216,0.7); }
  .rozet { font-size:11px; padding:2px 9px; border-radius:20px; background:rgba(91,154,120,0.18); color:#9BD3B3; }
  .nextEt { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#E0A458; margin-bottom:6px; }
  .ozgur { position:relative; margin-top:4px; }
  .ozgur .nokta { left:-29px; top:2px; width:18px; height:18px; border:2px solid #E0A458; background:#0C1A18; }
  .ozgur.geldi .nokta { background:#E0A458; }
  .ozgur .b { font-family:'Fraunces',serif; font-size:18px; color:#E7C089; }
  .ozgur .t { font-size:12px; color:rgba(239,231,216,0.5); margin-top:2px; }
  .mesaj { text-align:center; font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5; color:rgba(239,231,216,0.8); margin-top:26px; padding:0 6px; }
  .sayacBar { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:10px; }
  .mini { position:relative; border-radius:16px; padding:10px 14px; min-width:118px; text-align:center; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); cursor:pointer; }
  .mini.sag { cursor:default; }
  .mlbl { display:block; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(239,231,216,0.55); }
  .mnum { display:block; font-family:'Fraunces',serif; font-size:30px; color:#F6EEDF; line-height:1.05; margin-top:3px; }
  .mnum i { font-style:normal; font-size:12px; color:rgba(239,231,216,0.55); font-family:'Inter'; }
  .mhint { display:block; font-size:9.5px; color:rgba(239,231,216,0.4); margin-top:4px; }
  .mini.sol.aktif { border-color:#5B9A78; background:rgba(91,154,120,0.16); }
  .mini.sol.aktif .mhint { color:#9BD3B3; }
  .mini.sol.tamam { border-color:#5B9A78; background:rgba(91,154,120,0.26); }
  .mreset { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:6px; border:1px solid rgba(255,255,255,0.14); background:transparent; color:rgba(239,231,216,0.55); font-size:12px; cursor:pointer; line-height:1; padding:0; }
  @media (prefers-reduced-motion:reduce){ * { transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AY_KISA=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const BASLANGIC=new Date(2026,5,1);
const KREDILER=[
  {id:"akbank",  banka:"Akbank",     tur:"BİREYSEL",kalan:105000, vade:new Date(2026,7,1),  taksit:56500,  faiz:3.85},
  {id:"teb",     banka:"TEB",        tur:"OFİS",    kalan:1000000,vade:new Date(2027,5,15), taksit:110716, faiz:3.54},
  {id:"vakif1",  banka:"Vakıfbank 1",tur:"TİCARİ",  kalan:500000, vade:new Date(2029,1,20), taksit:26000,  faiz:3.46},
  {id:"deniz",   banka:"Denizbank",  tur:"BİREYSEL",kalan:125000, vade:new Date(2029,2,30), taksit:8300,   faiz:4.23},
  {id:"vakif2",  banka:"Vakıfbank 2",tur:"TİCARİ",  kalan:500000, vade:new Date(2029,5,26), taksit:31000,  faiz:2.99},
  {id:"ing",     banka:"İNG",        tur:"TİCARİ",  kalan:1150000,vade:new Date(2029,6,1),  taksit:57500,  faiz:3.36},
  {id:"dogus",   banka:"Doğuş Fin.", tur:"TİCARİ",  kalan:1000000,vade:new Date(2029,6,30), taksit:68561,  faiz:3.58},
  // Ekim 2026'da çekilen krediler (ilk taksit Kasım 2026). İş Bankası 36 ay; Akbank (2) adedi tahmindir.
  {id:"akbank2", banka:"Akbank (2)", tur:"KREDİ",   kalan:630000, vade:new Date(2027,8,24), taksit:73000,  faiz:"3.70", bas:new Date(2026,10,1), adet:11},
  {id:"isbank",  banka:"İş Bankası", tur:"KREDİ",   kalan:500000, vade:new Date(2029,9,24), taksit:38500,  faiz:"3.70", bas:new Date(2026,10,1), adet:36},
].sort((a,b)=>a.vade-b.vade);
const TOPLAM=KREDILER.reduce((s,k)=>s+k.kalan,0);
const HEDEF=KREDILER[KREDILER.length-1].vade;

const tl=(n)=>"₺"+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
const yuzde=(n)=>"%"+String(n).replace(".",",");
const tarihYaz=(d)=>d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear();
const tarihKisa=(d)=>d.getDate()+" "+AY_KISA[d.getMonth()]+" "+d.getFullYear();
function ayFarki(a,b){let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;return Math.max(0,m);}
function aysGun(hedef,now){if(hedef<=now)return{bitti:true,ay:0,gun:0};let ay=(hedef.getFullYear()-now.getFullYear())*12+(hedef.getMonth()-now.getMonth());let capa=new Date(now.getFullYear(),now.getMonth()+ay,now.getDate());if(capa>hedef){ay--;capa=new Date(now.getFullYear(),now.getMonth()+ay,now.getDate());}return{bitti:false,ay,gun:Math.round((hedef-capa)/86400000)};}

// ── kayıt (localStorage + yedek) ──
const mem={};
function load(){try{const v=localStorage.getItem("borc:odenen");return new Set(v?JSON.parse(v):[]);}catch(e){return new Set(mem.odenen||[]);}}
function save(set){const arr=[...set];mem.odenen=arr;try{localStorage.setItem("borc:odenen",JSON.stringify(arr));}catch(e){}}
let odenen=load();

function loadSet(key){try{const v=localStorage.getItem(key);return new Set(v?JSON.parse(v):[]);}catch(e){return new Set(mem[key]||[]);}}
function saveSet(key,set){const a=[...set];mem[key]=a;try{localStorage.setItem(key,JSON.stringify(a));}catch(e){}}
function loadVal(key,def){try{const v=localStorage.getItem(key);return (v!==null&&v!==undefined)?JSON.parse(v):def;}catch(e){return (key in mem)?mem[key]:def;}}
function saveVal(key,v){mem[key]=v;try{localStorage.setItem(key,JSON.stringify(v));}catch(e){}}
const isoT=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let harcamaGunler=loadSet("harcama:gunler");
const HEDEF_HARCAMA=20;
let kumarBas=loadVal("kumar:baslangic", isoT(new Date()));
saveVal("kumar:baslangic", kumarBas);
function kumarGunSay(){const b=new Date(kumarBas+"T00:00:00");const b0=new Date(b.getFullYear(),b.getMonth(),b.getDate());const t=new Date();const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.max(0,Math.round((t0-b0)/86400000));}

const bugun=new Date();
let pAy={yil:bugun.getFullYear(),ay:bugun.getMonth()};

const anahtar=(id,y,a)=>y+"-"+(a+1)+"|"+id;
const taksitSayisi=(k)=>k.adet||(ayFarki(k.bas||BASLANGIC,k.vade)+1);   // toplam taksit adedi
const odenenAdet=(id)=>[...odenen].filter(x=>x.endsWith("|"+id)).length;
function suanKalan(k){const N=taksitSayisi(k);const p=Math.min(odenenAdet(k.id),N);return Math.max(0,k.kalan*(1-p/N));}
const ayIdx=(y,a)=>y*12+a;
function odenebilir(k,y,a){const i=ayIdx(y,a);const b=k.bas||BASLANGIC;return i>=ayIdx(b.getFullYear(),b.getMonth()) && i<=ayIdx(k.vade.getFullYear(),k.vade.getMonth());}
const odendiMi=(k,y,a)=>odenen.has(anahtar(k.id,y,a));

const root=document.getElementById("app");

function render(){
  const now=new Date();
  const veri=KREDILER.map(k=>{const N=taksitSayisi(k);const p=odenenAdet(k.id);return {...k,N,p,kapandi:p>=N,suanKalan:suanKalan(k)};});
  const kalanTutar=veri.reduce((s,k)=>s+k.suanKalan,0);
  const odenenTutar=TOPLAM-kalanTutar; const oran=odenenTutar/TOPLAM;
  const kapananSay=veri.filter(k=>k.kapandi).length;
  const aylikOdeme=veri.filter(k=>!k.kapandi).reduce((s,k)=>s+k.taksit,0);
  const sirada=veri.find(k=>!k.kapandi)||null;
  const ana=aysGun(HEDEF,now);
  const siraSay=sirada?aysGun(sirada.vade,now):null;
  const tISO=isoT(now);
  const ayOnek=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-";
  const buAyHarcama=[...harcamaGunler].filter(x=>x.startsWith(ayOnek)).length;
  const bugunHarcamasiz=harcamaGunler.has(tISO);
  const kumarGun=kumarGunSay();

  // Aylık ödemeler bölümü
  const payable=KREDILER.filter(k=>odenebilir(k,pAy.yil,pAy.ay));
  const buOdenen=payable.filter(k=>odendiMi(k,pAy.yil,pAy.ay));
  const buTutar=buOdenen.reduce((s,k)=>s+k.taksit,0);
  const hepsiOdendi=payable.length>0 && buOdenen.length===payable.length;
  let orows="";
  if(payable.length===0) orows=`<div class="oyok">Bu ay için planlı taksit yok.</div>`;
  payable.forEach(k=>{const on=odendiMi(k,pAy.yil,pAy.ay);
    orows+=`<div class="orow ${on?"odendi":""}"><button class="ocheck" data-toggle="${k.id}">${on?"✓":""}</button>
      <span class="ob">${k.banka}</span><span class="ot">${tl(k.taksit)}</span></div>`;});

  let yol="";
  veri.forEach(k=>{const next=sirada&&k.id===sirada.id; const s=aysGun(k.vade,now); const krOran=k.p/k.N;
    yol+=`<div class="durak ${k.kapandi?"kapandi":""} ${next?"next":""}"><div class="nokta"></div>
      <div class="kart">${next?`<div class="nextEt">Sıradaki kapanış</div>`:""}
        <div class="kart-ust"><div><div class="banka">${k.banka}</div><div class="turfaiz">${k.tur}${k.faiz!=null?` · faiz ${yuzde(k.faiz)}`:""}</div></div>
          <div class="kalan">${k.kapandi?"₺0":tl(k.suanKalan)}</div></div>
        ${k.kapandi?"":`<div class="kart-orta"><div class="miniBar"><div style="width:${Math.max(krOran*100,2)}%"></div></div></div>`}
        <div class="kart-alt"><span>${k.p}/${k.N} taksit${k.kapandi?"":` · aylık ${tl(k.taksit)}`}</span>
          ${k.kapandi?`<span class="rozet">KAPANDI</span>`:`<span class="taksit">${tarihKisa(k.vade)}</span>`}</div></div></div>`;});

  root.innerHTML=`
    <div class="sayacBar">
      <div class="mini sol ${bugunHarcamasiz?"aktif":""} ${buAyHarcama>=HEDEF_HARCAMA?"tamam":""}" data-harcama>
        <span class="mlbl">Harcamasız</span>
        <span class="mnum">${buAyHarcama}<i>/${HEDEF_HARCAMA} gün</i></span>
        <span class="mhint">${bugunHarcamasiz?"bugün ✓ işaretli":"bugünü işaretle"}</span>
      </div>
      <div class="mini sag">
        <button class="mreset" data-kumar-reset title="Sıfırla">↺</button>
        <span class="mlbl">Kumarsız</span>
        <span class="mnum">${kumarGun}<i> gün</i></span>
        <span class="mhint">otomatik sayıyor</span>
      </div>
    </div>
    <div class="eyebrow">Borçsuz olmaya</div>
    <div class="hero">
      ${ana.bitti?`<div class="buyuk">Bitti</div>`:`<div class="buyuk">${ana.ay}<small> ay </small>${ana.gun}<small> gün</small></div>`}
      <div class="hedefTarih">son taksit · ${tarihYaz(HEDEF)}</div>
      <div class="canli" id="canli"></div>
      <div class="toplam"><span>Kalan toplam borç</span>${tl(kalanTutar)}</div>
    </div>
    <div class="stat">
      <div class="kutu"><div class="s">${tl(aylikOdeme)}</div><div class="e">Aylık ödeme</div></div>
      <div class="kutu"><div class="s">${kapananSay}/${KREDILER.length}</div><div class="e">Kapanan kredi</div></div>
    </div>
    <div class="ozetBar">
      <div class="u"><span>Yolun ilerlemesi</span><span><b>${Math.round(oran*100)}%</b> · ${tl(odenenTutar)} ödendi</span></div>
      <div class="bar"><div style="width:${Math.max(oran*100,1.5)}%"></div></div>
    </div>

    <div class="odeme">
      <div class="odeme-ust"><button class="oOk" data-oay="-1">‹</button>
        <span class="ay">${AYLAR[pAy.ay]} ${pAy.yil}</span>
        <button class="oOk" data-oay="1">›</button></div>
      <div class="odeme-durum"><span>${payable.length?`Ödenen: ${buOdenen.length}/${payable.length} · ${tl(buTutar)}`:"—"}</span>
        ${payable.length?`<button class="tumu" data-tumu="1">${hepsiOdendi?"Hepsini kaldır":"Hepsini işaretle"}</button>`:""}</div>
      ${orows}
    </div>

    <div class="yolBaslik">Özgürlüğe giden yol</div>
    <div class="yol">${yol}
      <div class="ozgur ${ana.bitti?"geldi":""}"><div class="nokta"></div>
        <div class="b">${ana.bitti?"Borçsuzsun":"Borçsuz gün"}</div><div class="t">${tarihYaz(HEDEF)}</div></div></div>
    <p class="mesaj">${hepsiOdendi?"Bu ayın tüm taksitleri ödendi. Helal olsun.":sirada?`Sıradaki ${sirada.banka} kredisi ${siraSay.ay} ay ${siraSay.gun} gün sonra kapanıyor. Her ödeme yükü hafifletir.`:"Tüm borçlar kapandı. Özgürsün."}</p>`;
  bagla(); tik();
}

function bagla(){
  document.querySelectorAll("[data-oay]").forEach(b=>b.onclick=()=>{let m=pAy.ay+ +b.dataset.oay,y=pAy.yil;if(m<0){m=11;y--;}if(m>11){m=0;y++;}pAy={yil:y,ay:m};render();});
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const id=b.dataset.toggle;const k=anahtar(id,pAy.yil,pAy.ay);if(odenen.has(k))odenen.delete(k);else odenen.add(k);save(odenen);render();});
  document.querySelectorAll("[data-tumu]").forEach(b=>b.onclick=()=>{const payable=KREDILER.filter(k=>odenebilir(k,pAy.yil,pAy.ay));const hepsi=payable.every(k=>odendiMi(k,pAy.yil,pAy.ay));payable.forEach(k=>{const key=anahtar(k.id,pAy.yil,pAy.ay);if(hepsi)odenen.delete(key);else odenen.add(key);});save(odenen);render();});
  document.querySelectorAll("[data-harcama]").forEach(b=>b.onclick=()=>{const t=isoT(new Date());if(harcamaGunler.has(t))harcamaGunler.delete(t);else harcamaGunler.add(t);saveSet("harcama:gunler",harcamaGunler);render();});
  document.querySelectorAll("[data-kumar-reset]").forEach(b=>b.onclick=()=>{const g=kumarGunSay();if(!confirm(g+" günlük kumarsız sayacın sıfırlanacak. Emin misin?"))return;if(!confirm("Bu işlem geri alınamaz. Sayaç bugünden (0) yeniden başlasın mı?"))return;kumarBas=isoT(new Date());saveVal("kumar:baslangic",kumarBas);render();});
}

function tik(){
  const el=document.getElementById("canli"); if(!el)return;
  const ms=Math.max(0,HEDEF-new Date());
  const gun=Math.floor(ms/86400000);
  const sa=String(Math.floor((ms%86400000)/3600000)).padStart(2,"0");
  const dk=String(Math.floor((ms%3600000)/60000)).padStart(2,"0");
  const sn=String(Math.floor((ms%60000)/1000)).padStart(2,"0");
  el.textContent=gun.toLocaleString("tr-TR")+" gün · "+sa+":"+dk+":"+sn;
}

render();
setInterval(tik,1000);
</script>
</body>
</html>
